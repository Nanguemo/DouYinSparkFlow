name: DouYin Spark Flow Schedule Run
on:
  workflow_dispatch: # 允许手动触发
  schedule: # 定时任务（主触发+兜底触发，防止 GitHub 调度跳过）
    - cron: "15 0 * * *" # 每天 00:15 UTC（北京 8:15）主触发
    - cron: "10 3 * * *" # 每天 03:10 UTC（北京 11:10）兜底
    - cron: "30 5 * * *" # 每天 05:30 UTC（北京 13:30）兜底
    - cron: "45 11 * * *" # 每天 11:45 UTC（北京 19:45）兜底
jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Check if already succeeded today
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TODAY=$(date -u +%F)
        COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/schedule.yml/runs?per_page=50" --jq "[.workflow_runs[] | select(.created_at >= \"${TODAY}\") | select(.id != ${GITHUB_RUN_ID})] | length")
        echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
        echo "今日已成功的运行次数(不含本次): ${COUNT}"
    - name: Set up Python
      if: steps.check.outputs.count == '0'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Test Douyin Accessibility
      if: steps.check.outputs.count == '0'
      run: |
        curl -I https://creator.douyin.com/
    - name: Install dependencies
      if: steps.check.outputs.count == '0'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Ensure browsers are installed
      if: steps.check.outputs.count == '0'
      run: playwright install chromium --with-deps --only-shell
    - name: Export Github Environment Variables and Secrets to JSON
      if: steps.check.outputs.count == '0'
      env:
        VARS_JSON: ${{ toJson(vars) }}
        SECRETS_JSON: ${{ toJson(secrets) }}
      run: python utils/export_github_env.py
    - name: Run DouYin Spark Flow
      if: steps.check.outputs.count == '0'
      run: python main.py
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.check.outputs.count == '0' }}
      with:
        name: run-logs
        path: logs/
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
