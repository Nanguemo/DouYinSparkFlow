name: DouYin Spark Flow Schedule
on:
  workflow_dispatch:
  schedule:
    - cron: "15 17 * * *"
    - cron: "15 20 * * *"
    - cron: "15 23 * * *"
    - cron: "15 2 * * *"
    - cron: "15 5 * * *"
    - cron: "15 8 * * *"
    - cron: "15 11 * * *"
    - cron: "15 14 * * *"

jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check if already succeeded today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Shanghai
        run: |
          TODAY_BEIJING=$(date +%F)
          TODAY_UTC=$(date -u -d "${TODAY_BEIJING}T00:00:00+08:00" +%Y-%m-%dT%H:%M:%SZ)
          export TODAY_UTC
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "success-marker") | select(.created_at >= env.TODAY_UTC)] | length')
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Beijing today(${TODAY_BEIJING}) count: ${COUNT}"
      - name: Set up Python
        if: steps.check.outputs.count == '0'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Test Douyin Accessibility
        if: steps.check.outputs.count == '0'
        run: |
          curl -I https://www.douyin.com/
      - name: Install dependencies
        if: steps.check.outputs.count == '0'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure browsers are installed
        if: steps.check.outputs.count == '0'
        run: playwright install chromium --with-deps --only-shell
      - name: Export Github Environment Variables and Secrets to JSON
        if: steps.check.outputs.count == '0'
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: python utils/export_github_env.py
      - name: Run DouYin Spark Flow
        if: steps.check.outputs.count == '0'
        run: python main.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.check.outputs.count == '0' }}
        with:
          name: run-logs
          path: logs/
      - name: Create success marker
        if: ${{ success() && steps.check.outputs.count == '0' }}
        run: echo "success" > logs/success-marker.txt
      - uses: actions/upload-artifact@v4
        if: ${{ success() && steps.check.outputs.count == '0' }}
        with:
          name: success-marker
          path: logs/success-marker.txt

      - name: Auto-refresh Cookie Secret
        if: ${{ success() && steps.check.outputs.count == '0' }}
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -f logs/refreshed_cookies.json ]; then
            echo "Found refreshed cookies, updating GitHub Secret..."
            python - << 'PYEOF'
          import base64, json, os, sys, requests
          from nacl import encoding, public

          token = os.environ.get("PAT_TOKEN", "")
          if not token:
              print("PAT_TOKEN not set, skipping cookie refresh")
              sys.exit(0)

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          secret_name = "COOKIES_ZKX051118"

          with open("logs/refreshed_cookies.json", "r", encoding="utf-8") as f:
              cookies = json.load(f)
          secret_value = json.dumps(cookies, ensure_ascii=False)

          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
          r = requests.get(f"https://api.github.com/repos/{repo}/actions/secrets/public-key", headers=headers, timeout=30)
          if r.status_code != 200:
              print(f"Failed to get public key: {r.status_code}")
              sys.exit(1)
          pk = r.json()

          pk_obj = public.PublicKey(pk["key"].encode("utf-8"), encoding.Base64Encoder())
          encrypted = public.SealedBox(pk_obj).encrypt(secret_value.encode("utf-8"))
          enc_b64 = base64.b64encode(encrypted).decode("utf-8")

          r = requests.put(
              f"https://api.github.com/repos/{repo}/actions/secrets/{secret_name}",
              headers=headers,
              json={"encrypted_value": enc_b64, "key_id": pk["key_id"]},
              timeout=30,
          )
          if r.status_code in (201, 204):
              print(f"SUCCESS: Secret {secret_name} updated with {len(cookies)} cookies")
          else:
              print(f"FAILED: HTTP {r.status_code}")
              sys.exit(1)
          PYEOF
          else
            echo "No refreshed cookies found, skipping update"
          fi

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
