name: DouYin Spark Flow Schedule Run
on:
  workflow_dispatch:
  schedule:
    - cron: "15 17 * * *"
    - cron: "15 20 * * *"
    - cron: "15 23 * * *"
    - cron: "15 2 * * *"
    - cron: "15 5 * * *"
    - cron: "15 8 * * *"
    - cron: "15 11 * * *"
    - cron: "15 14 * * *"
jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Check if already succeeded today
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        TZ: Asia/Shanghai
      run: |
        TODAY_BEIJING=$(date +%F)
        TODAY_UTC=$(date -u -d "${TODAY_BEIJING}T00:00:00+08:00" +%Y-%m-%dT%H:%M:%SZ)
        export TODAY_UTC
        COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "run-logs") | select(.created_at >= env.TODAY_UTC)] | length')
        echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
        echo "Beijing today(${TODAY_BEIJING}) count: ${COUNT}"
    - name: Set up Python
      if: steps.check.outputs.count == '0'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Test Douyin Accessibility
      if: steps.check.outputs.count == '0'
      run: |
        curl -I https://creator.douyin.com/
    - name: Install dependencies
      if: steps.check.outputs.count == '0'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Ensure browsers are installed
      if: steps.check.outputs.count == '0'
      run: playwright install chromium --with-deps --only-shell
    - name: Export Github Environment Variables and Secrets to JSON
      if: steps.check.outputs.count == '0'
      env:
        VARS_JSON: ${{ toJson(vars) }}
        SECRETS_JSON: ${{ toJson(secrets) }}
      run: python utils/export_github_env.py
    - name: Run DouYin Spark Flow
      if: steps.check.outputs.count == '0'
      run: python main.py
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.check.outputs.count == '0' }}
      with:
        name: run-logs
        path: logs/
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
